name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Core Local (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:runner
      - run: npm run test:migrations
      - run: npm run test:release
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run audit:prod
      - name: Local restart and persistence acceptance
        if: runner.os == 'macOS'
        run: npm run test:usability
      - name: Full integration and migration drift
        if: runner.os == 'Linux'
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle
          npm run test:integration
      - name: Reproducible release package
        run: |
          npm run package:release
          npm run release:checksums
          cd release
          shasum -a 256 -c SHA256SUMS
